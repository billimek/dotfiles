name: Bump flake.lock

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - run: nix flake update

      - uses: actions/upload-artifact@v6
        with:
          name: flake-lock
          path: flake.lock

  # Evaluate every config the updated lockfile would build before committing it,
  # so a breaking upstream change is caught here instead of at `nh switch` time.
  # work-laptop configs are excluded: they import ../../secrets.nix, which is
  # git-crypt encrypted and unreadable to this runner, so evaluating them would
  # fail for reasons unrelated to the lockfile bump.
  #
  # Split into a per-platform matrix because some configs need import-from-derivation
  # to evaluate (e.g. modules.zmx pulls inputs.zmx.packages.${system}.default, which
  # reads build.zig.zon via a helper derivation), so evaluation on a foreign-arch
  # runner fails outright rather than just being slow.
  eval:
    needs: update
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            attrs: |
              nixosConfigurations.nas.config.system.build.toplevel
              nixosConfigurations.home.config.system.build.toplevel
              homeConfigurations."jeff@home".activationPackage
              homeConfigurations."nix@nas".activationPackage
            build: true
          - runner: ubuntu-24.04-arm
            attrs: |
              nixosConfigurations.cloud.config.system.build.toplevel
              homeConfigurations."jeff@cloud".activationPackage
            build: true
          - runner: macos-latest
            attrs: |
              darwinConfigurations.Jeffs-M3Pro.config.system.build.toplevel
              homeConfigurations."jeff@Jeffs-M3Pro".activationPackage
            build: true
    runs-on: ${{ matrix.runner }}
    env:
      NCPS_HOST: cloud.drake-eel.ts.net:8443
      NCPS_USER: ${{ secrets.NCPS_USER }}
      NCPS_PASSWORD: ${{ secrets.NCPS_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: flake-lock
          path: .

      # Ubuntu 24.04 runners restrict unprivileged user namespaces by default, which
      # breaks bwrap-sandboxed IFD builds (e.g. zig2nix, needed by modules.zmx).
      # This is the standard workaround for that GitHub Actions regression.
      - name: Allow unprivileged user namespaces (sandboxed builds)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Free disk space (linux builds)
        if: ${{ matrix.build && runner.os == 'Linux' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      # The Determinate installer handles macos-latest's partially-preinstalled Nix
      # cleanly (unlike cachix/install-nix-action, which failed there with
      # eDSRecordAlreadyExists); it's already the trusted installer for Darwin
      # hosts in this repo (see modules/darwin-modules/determinate.nix). Used on
      # every leg for consistency.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cloud.drake-eel.ts.net:8443 https://zmx.cachix.org https://nix-community.cachix.org https://nixpkgs-unfree.cachix.org https://cache.saumon.network/proxmox-nixos
            extra-trusted-public-keys = ${{ secrets.NCPS_PUBLIC_KEY }} zmx.cachix.org-1:9E7zdDiSiG9PnSl8RFHbZ3AW2NmIy/7SPK9rRwed7r4= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixpkgs-unfree.cachix.org-1:hqvoInulhbV4nJ9yJOEr+4wxhDV4xq2d1DK7S6Nj6rs= proxmox-nixos:D9RYSWpQQC/msZUWphOY2I5RLH5Dd6yQcaHIuug7dWM=

      - name: Evaluate updated configs
        run: |
          set -euo pipefail
          while IFS= read -r attr; do
            [ -z "$attr" ] && continue
            echo "== .#$attr =="
            nix eval --no-write-lock-file ".#$attr.drvPath"
          done <<'ATTRS'
          ${{ matrix.attrs }}
          ATTRS

      - name: Build updated configs
        if: ${{ matrix.build }}
        run: |
          set -euo pipefail
          while IFS= read -r attr; do
            [ -z "$attr" ] && continue
            echo "== build .#$attr =="
            nix build --no-write-lock-file --no-link ".#$attr"
          done <<'ATTRS'
          ${{ matrix.attrs }}
          ATTRS

      # Pushes the full closure; paths ncps already has are skipped.
      - name: Push built paths to ncps
        if: ${{ matrix.build && env.NCPS_PASSWORD != '' }}
        run: |
          set -euo pipefail
          printf 'machine %s\nlogin %s\npassword %s\n' "${NCPS_HOST%%:*}" "$NCPS_USER" "$NCPS_PASSWORD" > "$RUNNER_TEMP/ncps.netrc"
          chmod 600 "$RUNNER_TEMP/ncps.netrc"
          while IFS= read -r attr; do
            [ -z "$attr" ] && continue
            nix copy --no-write-lock-file --option netrc-file "$RUNNER_TEMP/ncps.netrc" \
              --to "https://$NCPS_HOST/upload" ".#$attr"
          done <<'ATTRS'
          ${{ matrix.attrs }}
          ATTRS

  commit:
    needs: eval
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: flake-lock
          path: .

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Bump flake.lock
          branch: master
          commit_options: '--no-verify --signoff'
          file_pattern: flake.lock
          skip_dirty_check: false
          skip_fetch: true

  notify:
    needs: [update, eval, commit]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      # Slack incoming webhook; a Discord webhook URL with /slack appended also works.
      - name: Send failure alert
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set; skipping alert"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"dotfiles: flake.lock bump failed, lock not committed. $RUN_URL\"}" \
            "$WEBHOOK_URL"
